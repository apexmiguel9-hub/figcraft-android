name: gen-keystore

# Genera la clave de firma fija del port Android y la sube al repo.
# Se ejecuta **una vez**: el keystore queda versionado y `build-apk.yml` lo usa tal cual.
#
# MEDIDO: sin una clave fija, AGP genera una nueva en cada runner y `adb install -r` falla con
# INSTALL_FAILED_UPDATE_INCOMPATIBLE.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Generar el keystore
        run: |
          KS=figcraft-debug.keystore
          keytool -genkeypair -v \
            -keystore "$KS" \
            -storetype PKCS12 \
            -alias figcraftdebug \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass android -keypass android \
            -dname "CN=FigCraft Debug, OU=Android Port, O=apexmiguel9-hub, L=, ST=, C=ES"
          echo "### generado"
          keytool -list -keystore "$KS" -storepass android

      - name: Subirlo al repo
        run: |
          KS=figcraft-debug.keystore
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$KS" apps/figcraft-android/android/app/figcraft-debug.keystore
          git add apps/figcraft-android/android/app/figcraft-debug.keystore
          git commit -m "chore(android): clave de firma debug fija para que install -r funcione"
          git push
          echo "### subida a main"