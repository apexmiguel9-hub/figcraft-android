name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# suite's shared gate workflow in craft-common-actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      # The craft-fonts commit release.yml builds with. Needs fonts/latin-manifest.txt (Inter):
      # crates/text/build.rs fails a build that requires craft-fonts without it. Only craft-fonts'
      # pr/latin-presentation-fonts has it; its main has Noto Sans Georgian but no Inter. Re-pin
      # once one commit has both (storytold/craft-fonts#42).
      craft-fonts-ref: 43913056ce82a3fdad0ef69f6b88d1dc922a8104
      packages: >-
        libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
        libgtk-3-dev
