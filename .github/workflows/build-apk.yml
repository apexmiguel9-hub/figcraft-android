name: build-apk

on:
  push:
    paths:
      - 'apps/figcraft-android/android/**'
      - '.github/workflows/build-apk.yml'
  workflow_run:
    workflows: ['build-android-so']
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  ANDROID_TARGET: aarch64-linux-android
  ANDROID_ABI: arm64-v8a
  SO_ARTIFACT: figcraft-android-so

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Poner el SDK de Android en el PATH
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Instalar el NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;26.1.10909125"
          echo "NDK_DIR=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: apk-gradle-${{ hashFiles('apps/figcraft-android/android/**/*.gradle') }}
          restore-keys: apk-gradle-

      - name: Traer la ultima .so que haya compilado bien
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "buscando el artefacto '$SO_ARTIFACT' en los runs con exito de build-android-so.yml"
          AID=""
          FOUND_RUN=""
          for RUN in $(gh api -X GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/build-android-so.yml/runs?status=success&per_page=30" \
              --jq '.workflow_runs[].id'); do
            A=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts" \
                --jq ".artifacts[]|select(.name==\"$SO_ARTIFACT\")|.id" 2>/dev/null | head -1)
            if [ -n "$A" ]; then
              AID="$A"; FOUND_RUN="$RUN"; break
            fi
          done

          if [ -z "$AID" ]; then
            echo "::error::no hay ninguna .so publicada. Lanza build-android-so.yml primero."
            exit 1
          fi
          echo "### .so del run $FOUND_RUN, artefacto $AID"

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > so.zip
          unzip -o -q so.zip
          ls -la

          mkdir -p "apps/figcraft-android/android/app/src/main/jniLibs/$ANDROID_ABI"
          cp libfigcraft_android.so \
             "apps/figcraft-android/android/app/src/main/jniLibs/$ANDROID_ABI/"
          chmod 644 "apps/figcraft-android/android/app/src/main/jniLibs/$ANDROID_ABI/libfigcraft_android.so"
          echo "### colocada en jniLibs/$ANDROID_ABI"

      - name: Fijar la versión de Gradle
        working-directory: apps/figcraft-android/android
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          ./gradlew --version | head -3

      - name: Construir con Gradle
        working-directory: apps/figcraft-android/android
        env:
          ANDROID_NDK_HOME: ${{ env.NDK_DIR }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Comprobar que el APK lleva el .so dentro
        run: |
          APK=apps/figcraft-android/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::no sale el APK en $APK"; exit 1; }
          echo "### APK: $(du -h $APK | cut -f1)"
          unzip -l "$APK" | grep -E '\.so|classes.*dex|AndroidManifest' || true
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libfigcraft_android.so' || {
            echo "::error::el APK NO lleva lib/arm64-v8a/libfigcraft_android.so"
            exit 1
          }
          echo "OK: la libreria esta dentro"
          unzip -p "$APK" lib/arm64-v8a/libfigcraft_android.so > /tmp/so.apk.so
          READELF=$(find "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt -name llvm-readelf -type f 2>/dev/null | head -1)
          "$READELF" -S /tmp/so.apk.so | grep -q '\.symtab' || {
            echo "::error::la .so del APK no tiene .symtab"
            exit 1
          }
          echo "OK: conserva .symtab"

      - name: Comprobar que el APK se puede instalar
        run: |
          APK=apps/figcraft-android/android/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_SDK_ROOT"/build-tools -name aapt2 -type f 2>/dev/null | head -1)
          "$AAPT" dump badging "$APK" | head -5
          "$AAPT" dump badging "$APK" | grep -q "package: name" || {
            echo "::error::aapt no lee el APK"
            exit 1
          }
          echo "OK: el APK es valido"

      - name: Comprobar que el APK lleva la clase del Activity
        run: |
          APK=apps/figcraft-android/android/app/build/outputs/apk/debug/app-debug.apk
          PATRON="ai/storyteller/figcraft/MainActivity"
          ENCONTRADA=""
          for D in $(unzip -l "$APK" | awk '{print $4}' | grep -E '^classes[0-9]*\.dex$'); do
            unzip -p "$APK" "$D" > /tmp/uno.dex
            if grep -aq "$PATRON" /tmp/uno.dex; then
              ENCONTRADA="$D"
              break
            fi
          done
          if [ -n "$ENCONTRADA" ]; then
            echo "OK: la clase esta en $ENCONTRADA"
          else
            echo "::error::el APK NO lleva la clase ai.storyteller.figcraft.MainActivity"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: figcraft-android-debug
          path: apps/figcraft-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
