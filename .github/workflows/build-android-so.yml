name: build-android-so

on:
  push:
    paths:
      - 'apps/figcraft-android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-android-so.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ANDROID_TARGET: aarch64-linux-android
  ANDROID_ABI: arm64-v8a
  SO_ARTIFACT: figcraft-android-so

jobs:
  so:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      # Android no tiene las fuentes del sistema donde las busca el motor de texto
      # (`/usr/share/fonts`), asi que sin craft-fonts no hay ninguna fuente para el texto
      # del lienzo: la capa se queda en 1x14 y no se ve lo que se escribe. Es el mismo pin
      # que usa CI para que el .so y los tests midan con las mismas caras.
      - name: Check out craft-fonts
        uses: actions/checkout@v7
        with:
          repository: storytold/craft-fonts
          ref: 43913056ce82a3fdad0ef69f6b88d1dc922a8104
          path: craft-fonts

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Poner el rustc por delante de el de la imagen
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Decir que rustc se va a usar
        run: rustc --version && cargo --version

      - name: Instalar target Android
        run: rustup target add "$ANDROID_TARGET"

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Regenerar Cargo.lock si hace falta
        run: cargo generate-lockfile --quiet

      - name: Cache de target/
        uses: actions/cache@v6
        with:
          path: target
          key: android-so-${{ hashFiles('Cargo.lock') }}
          restore-keys: android-so-

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Poner el SDK de Android en el PATH
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Instalar el NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;26.1.10909125"
          echo "NDK_DIR=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Compilar la libreria nativa
        env:
          ANDROID_NDK_HOME: ${{ env.NDK_DIR }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: |
          cargo ndk -t "$ANDROID_ABI" -o ./target build -p figcraft-android --locked
          SO="target/$ANDROID_TARGET/debug/libfigcraft_android.so"
          echo "--- .so producido ---"
          ls -la "$SO"
          file "$SO"
          echo "--- quitando la tabla de depuracion (no los simbolos) ---"
          # Encuentra las herramientas de llvm del NDK probando varias rutas posibles
          # (la estructura interna del NDK varia segun la version de sdkmanager).
          find_ndk_tool() {
            local name="$1"
            for cand in \
              "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$name" \
              "$ANDROID_NDK_HOME/prebuilt/linux-x86_64/bin/$name" \
              $(find "$ANDROID_NDK_HOME" -name "$name" -type f 2>/dev/null | head -1); do
              if [ -x "$cand" ]; then
                echo "$cand"
                return 0
              fi
            done
            return 1
          }
          STRIP=$(find_ndk_tool llvm-strip)
          test -n "$STRIP" || { echo "::error::no encuentro llvm-strip en el NDK ($ANDROID_NDK_HOME)"; ls "$ANDROID_NDK_HOME" 2>/dev/null || true; exit 1; }
          echo "Usando strip: $STRIP"
          "$STRIP" --strip-debug "$SO"
          ls -la "$SO"

      - name: Comprobar que el .so tiene tabla de excepciones
        run: |
          # Encuentra las herramientas de llvm del NDK (igual que el paso de compilacion).
          find_ndk_tool() {
            local name="$1"
            for cand in \
              "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$name" \
              "$ANDROID_NDK_HOME/prebuilt/linux-x86_64/bin/$name" \
              $(find "$ANDROID_NDK_HOME" -name "$name" -type f 2>/dev/null | head -1); do
              if [ -x "$cand" ]; then
                echo "$cand"
                return 0
              fi
            done
            return 1
          }
          SO=target/$ANDROID_TARGET/debug/libfigcraft_android.so
          READELF=$(find_ndk_tool llvm-readelf)
          "$READELF" -S "$SO" | grep -q '\.eh_frame' || {
            echo "::error::el .so no tiene .eh_frame: los panics saldrán sin backtrace"
            exit 1
          }
          echo "OK: .eh_frame presente"
          MB=$(( $(stat -c%s "$SO") / 1000000 ))
          echo "### .so: ${MB} MB"
          [ "$MB" -lt 200 ] || { echo "::error::el .so pesa ${MB} MB: el strip no ha corrido"; exit 1; }

      - name: Comprobar que el .so esta COMPLETO
        run: |
          # Encuentra las herramientas de llvm del NDK (igual que el paso de compilacion).
          find_ndk_tool() {
            local name="$1"
            for cand in \
              "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$name" \
              "$ANDROID_NDK_HOME/prebuilt/linux-x86_64/bin/$name" \
              $(find "$ANDROID_NDK_HOME" -name "$name" -type f 2>/dev/null | head -1); do
              if [ -x "$cand" ]; then
                echo "$cand"
                return 0
              fi
            done
            return 1
          }
          SO=target/$ANDROID_TARGET/debug/libfigcraft_android.so
          READELF=$(find_ndk_tool llvm-readelf)
          NM=$(find_ndk_tool llvm-nm)
          SIZE=$(find_ndk_tool llvm-size)

          echo "=== las diez secciones mas grandes ==="
          "$SIZE" -A -d "$SO" 2>/dev/null | sort -k2 -n -r | head -11 \
            || "$READELF" -S "$SO" | head -20

          echo
          echo "=== hay secciones de depuracion? (no deberia haber) ==="
          if "$READELF" -S "$SO" | grep -q '\.debug_'; then
            echo "::error::quedan secciones .debug_: el strip no ha corrido"
            exit 1
          fi
          echo "OK: ninguna"

          echo
          echo "=== simbolos de entrada ==="
          "$NM" -D --defined-only "$SO" | grep -w android_main \
            || { echo "::error::la .so no exporta android_main: no arranca"; exit 1; }
          echo "OK: android_main exportado"

          echo
          echo "=== cuanto codigo hay de verdad ==="
          TEXT=$("$SIZE" -A -d "$SO" | awk '$1==".text"{print $2}')
          echo "### .text = $TEXT bytes ($((TEXT / 1000000)) MB)"
          [ "$TEXT" -gt 5000000 ] || {
            echo "::error::solo $TEXT bytes de .text: el enlazador se ha comido el codigo."
            exit 1
          }
          echo "OK: la libreria esta entera"

      - name: Publicar la .so
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SO_ARTIFACT }}
          path: target/aarch64-linux-android/debug/libfigcraft_android.so
          if-no-files-found: error
          retention-days: 30
