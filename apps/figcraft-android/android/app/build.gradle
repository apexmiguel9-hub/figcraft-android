apply plugin: 'com.android.application'

// MEDIDO, y es la pieza que hace funcionar `adb install -r`: una clave de firma **fija**.
//
// Sin esto, AGP genera `~/.android/debug.keystore` nuevo en cada runner de CI, cada APK sale
// firmado con una clave distinta y la actualizacion falla con:
//
//     INSTALL_FAILED_UPDATE_INCOMPATIBLE: Existing package signatures do not match
//
// que obliga a `adb uninstall` — y el uninstall **borra los datos de la app y el permiso** de
// almacenamiento, que es lo mas lento de probar.
//
// La clave esta versionada en el repo a proposito: es una clave de **debug**, no protege nada,
// y es lo unico que garantiza que todos los builds firmen igual.
//
// MEDIDO: `signingConfigs` va **dentro** de `android { }`. Fuera, Gradle contesta
//
//     Could not find method signingConfigs() for arguments [...] on project ':app'
//
android {
    namespace 'ai.storyteller.figcraft'
    compileSdk 34
    ndkVersion '26.1.10909125'

    signingConfigs {
        debug {
            storeFile file('figcraft-debug.keystore')
            storePassword 'android'
            keyAlias 'figcraftdebug'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'ai.storyteller.figcraft'
        minSdk 24
        targetSdk 34
        versionCode 1
        // MEDIDO: estaba fijo en '0.6.0' y se quedo desfasado al mergear upstream v0.7.0, asi
        // que Ajustes > Acerca de y el log de arranque (`figcraft-android: arrancando, version`)
        // decian una cosa y el workspace otra. El `Cargo.toml` del port si la hereda
        // (`version.workspace = true`), asi que aqui se pone la del workspace a mano.
        versionName '0.7.0'

        // MEDIDO, y esto es lo que hace que `adb install -r` funcione: sin `signingConfig`
        // explicito, AGP genera un keystore debug **nuevo en cada runner**, asi que cada APK
        // sale firmado con una clave distinta y la instalacion falla con
        //
        //     INSTALL_FAILED_UPDATE_INCOMPATIBLE: Existing package signatures do not match
        //
        // obligando a `adb uninstall`, que **borra los datos de la app y el permiso** de
        // almacenamiento. Con la clave fija de abajo, el APK se actualiza encima sin uninstall.
        //
        // MEDIDO que la clave es de **debug**, no de release: es para el port de desarrollo, y
        // no protege nada. Se versiona en el repo a proposito, que es lo unico que garantiza que
        // la firma sea la misma en todas las ejecuciones.
        signingConfig signingConfigs.debug

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
            // AGP re-stri pea la .so al empaquetar y quita .symtab: sin esto
            // los backtrace de Rust salen como direcciones crudas.
            keepDebugSymbols += ['**/*.so']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable true
        }
    }
}

dependencies {
    // Con native-activity NO hay dependencia Java: NativeActivity viene en el OS.
    implementation 'androidx.annotation:annotation:1.7.1'
}

// El .so lo compila cargo (build-android-so.yml), no Gradle.
// Local:
//   cargo ndk -t arm64-v8a -o ./target build -p figcraft-android --locked
//   cp target/aarch64-linux-android/debug/libfigcraft_android.so \
//      apps/figcraft-android/android/app/src/main/jniLibs/arm64-v8a/
//   ./gradlew assembleDebug (en apps/figcraft-android/android/)

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation'
}
