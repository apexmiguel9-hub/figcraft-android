apply plugin: 'com.android.application'

android {
    namespace 'ai.storyteller.figcraft'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'ai.storyteller.figcraft'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.6.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
            // AGP re-stri pea la .so al empaquetar y quita .symtab: sin esto
            // los backtrace de Rust salen como direcciones crudas.
            keepDebugSymbols += ['**/*.so']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable true
        }
    }
}

dependencies {
    // Con native-activity NO hay dependencia Java: NativeActivity viene en el OS.
    implementation 'androidx.annotation:annotation:1.7.1'
}

// El .so lo compila cargo (build-android-so.yml), no Gradle.
// Local:
//   cargo ndk -t arm64-v8a -o ./target build -p figcraft-android --locked
//   cp target/aarch64-linux-android/debug/libfigcraft_android.so \
//      apps/figcraft-android/android/app/src/main/jniLibs/arm64-v8a/
//   ./gradlew assembleDebug (en apps/figcraft-android/android/)

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation'
}
