// Raiz del proyecto Android de FigCraft.
// Solo se compila `arm64-v8a` (igual que vectorcraft): el render es CPU
// (tiny-skia), la GPU solo presenta. Mas arquitecturas = `abiFilters`.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
