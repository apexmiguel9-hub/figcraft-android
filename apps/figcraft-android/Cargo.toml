[package]
name = "figcraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FigCraft en Android: clon Figma 100% Rust con gestos tactiles"

# Igual que vectorcraft-android: aqui NO se heredan los lints del workspace.
# El workspace prohibe `unsafe_code = "forbid"`, y `#[unsafe(no_mangle)]`
# en `android_main` lo necesita (patron eframe/examples/hello_android).
# [lints]
# workspace = true

[dependencies]
figcraft-engine = { workspace = true }
figcraft-ui-egui = { workspace = true }
figcraft-collab-net = { workspace = true }
figcraft-format = { workspace = true }
figcraft-text = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# MEDIDO, y este es EL cambio grande del port: `android-game-activity` en vez de
# `android-native-activity`.
#
# Con `native-activity` el teclado blando **se muestra pero sus teclas no llegan**: `NativeActivity`
# de AOSP no es una `View`, luego no hay `InputConnection`, y el IME no tiene contra quien enviar el
# texto. El logcat lo delata en bucle:
#
#     GoogleInputMethodService: onStartInputView() : Dummy InputConnection bound
#     ImeTracker: onRequestShow  at ORIGIN_CLIENT reason SHOW_SOFT_INPUT
#     ImeTracker: onCancelled     at PHASE_WM_ABORT_SHOW_IME_POST_LAYOUT
#
# Es el bug documentado en el HANDOFF (§4.3) y el que hace vectorcraft. `GameActivity` **si** tiene
# vista y por tanto `InputConnection`, asi que el teclado funciona sin trucos.
#
# MEDIDO que la feature `game-activity` existe en `android-activity` 0.6
# (`Cargo.toml`: `game-activity = ["simd_cesu8"]`), y que la dependencia Java
# `androidx.games:games-activity:4.4.0` si existe en el maven de Google (HTTP 200 comprobado).
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-game-activity"] }
egui = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
winit = { workspace = true }
# MEDIDO: `game-activity` es la feature que da la `GameActivity` de androidx.games, que si tiene
# vista (y por tanto teclado blando) — ver el comentario de `eframe` mas arriba.
#
# MEDIDO que `android-activity` queda como dependencia **directa** y no solo transitiva de winit:
# `AndroidApp::text_input_state()` y `set_text_input_state()` son la pieza que conecta el teclado
# con egui (winit no expone el texto del `GameTextInput`), y `TextInputState`/`TextSpan` son los
# tipos que hay que construir para inicializar ese buffer. Ver `src/lib.rs`, `teclado_a_eventos`.
android-activity = { version = "0.6", default-features = false, features = ["game-activity"] }
android_logger = { workspace = true }
# El browser de ficheros, dibujado DENTRO de la app.
#
# MEDIDO y es lo que sustituye a SAF entero: abrir una segunda Activity da ANR en este port
# (el handshake de `android-activity` bloquea el hilo principal de Java hasta que el hilo del
# bucle confirma la pausa, y ese hilo es el que corre el update de egui).
#
# MEDIDO que este crate no trae nada de Android: `grep -rniE 'android|jni|SAF' src/` no
# devuelve ni una linea. Es egui puro con el sistema de ficheros enchufable, y el que trae
# por defecto ya es `std::fs` (`src/lib.rs:231`, `fs: Box::new(Fs {})`). O sea: no hay que
# escribir ni un `Vfs`.
egui_file = "0.28"

[lib]
name = "figcraft_android"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "figcraft-android"
path = "src/main.rs"
