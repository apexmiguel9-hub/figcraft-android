[package]
name = "figcraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FigCraft en Android: clon Figma 100% Rust con gestos tactiles"

# Igual que vectorcraft-android: aqui NO se heredan los lints del workspace.
# El workspace prohibe `unsafe_code = "forbid"`, y `#[unsafe(no_mangle)]`
# en `android_main` lo necesita (patron eframe/examples/hello_android).
# [lints]
# workspace = true

[dependencies]
figcraft-engine = { workspace = true }
figcraft-ui-egui = { workspace = true }
figcraft-collab-net = { workspace = true }
figcraft-format = { workspace = true }
figcraft-text = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# MEDIDO, y este cambio dio la vuelta: se paso a `android-game-activity` y se ha vuelto a
# `android-native-activity`, **igual que vectorcraft**, que si escribe texto en el mismo telefono.
#
# MEDIDO por que `game-activity` rompe el texto, con el APK instalado de vectorcraft a la vista:
#
# * La superclase Java es distinta. Extrayendo el APK de vectorcraft del movil y mirando los `.dex`:
#
#       classes3.dex → Landroid/app/NativeActivity;
#
#   o sea `android.app.NativeActivity`, NO `com.google.androidgamesdk.GameActivity`.
#
# * `GameActivity` manda el texto al `GameTextInput` de androidx.games y **se come las teclas**, asi
#   que Android no genera ningun `KeyEvent`. En el logcat de figcraft solo aparece:
#
#       D/gti.InputConnection: commitText: h
#
#   y ningun evento de teclado.
#
# * MEDIDO en el codigo de winit 0.30.13 que ambos usan: el backend de Android **no entrega texto**.
#   `src/platform_impl/android/mod.rs:926`:
#
#       pub fn set_ime_purpose(&self, _purpose: ImePurpose) {}    // vacio
#
#   y `grep -rn "WindowEvent::Text"` en todo winit da **cero resultados**: ese evento no existe.
#
# * MEDIDO en eframe 0.36.2: `Event::Text` solo se genera en `src/web/`. El backend nativo no.
#
# * MEDIDO en egui 0.36.2: `Event::Text` solo se *consume* (`text_edit/builder.rs:1145`), nunca se
#   produce.
#
# O sea: con `GameActivity` el texto se queda en un lado de donde **nadie** lo lee, y habia que
# escribir un puente a mano para sacarlo. Con `native-activity` Android manda **teclas** al
# `InputConnection` de AOSP, winit las recibe (`InputEvent::KeyEvent`, `mod.rs:425`) y el texto
# sale por ahi, sin inventar nada.
#
# MEDIDO tambien que los manifests de los dos ports son identicos en lo que suele decidir del
# teclado
# (`android:windowSoftInputMode="adjustResize"` y los mismos `configChanges`), asi que el manifest no
# era la causa.
#
# MEDIDO que laidea de que "`NativeActivity` no tiene `InputConnection`, luego el teclado no llega"
# es falsa en este telefono: es exactamente lo que hace vectorcraft, y ahi escribe.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
egui = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
winit = { workspace = true }
# MEDIDO que `android-activity` queda como dependencia **directa** y no solo transitiva de winit:
# `android_main` recibe el `AndroidApp` como argumento y hace falta para arrancar el bucle.
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
# PRUEBA VULKAN: la misma version que resuelve `egui-wgpu`, pero con la feature `trace`, que vuelca
# a un fichero los shaders WGSL que se compilan. Sin esto el unico rastro del fallo del driver es un
# `abort()` sin contexto:
#
#     egui_wgpu::Renderer::new() -> wgpu_hal::vulkan::Device::create_render_pipeline
#       -> vulkan.mtk.so FragmentShaderCompileState::CompileUF() -> abort()
#
# Cargo unifica las features de una misma version, asi que esto **activa** el trace del `wgpu` que
# usa `egui-wgpu`, no añade una segunda copia.
wgpu = { version = "30", default-features = false, features = ["trace", "wgsl", "vulkan", "gles"] }
android_logger = { workspace = true }
# El browser de ficheros, dibujado DENTRO de la app.
#
# MEDIDO y es lo que sustituye a SAF entero: abrir una segunda Activity da ANR en este port
# (el handshake de `android-activity` bloquea el hilo principal de Java hasta que el hilo del
# bucle confirma la pausa, y ese hilo es el que corre el update de egui).
#
# MEDIDO que este crate no trae nada de Android: `grep -rniE 'android|jni|SAF' src/` no
# devuelve ni una linea. Es egui puro con el sistema de ficheros enchufable, y el que trae
# por defecto ya es `std::fs` (`src/lib.rs:231`, `fs: Box::new(Fs {})`). O sea: no hay que
# escribir ni un `Vfs`.
egui_file = "0.28"

[lib]
name = "figcraft_android"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "figcraft-android"
path = "src/main.rs"
